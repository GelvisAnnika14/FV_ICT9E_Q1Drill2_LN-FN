	<style>
		section{
            background-color: #ffbaba;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1,p{
        	text-align: center;
        }
        body{
        	font-family: 'Courier New', Courier, monospace;
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;

<body>
	<header>
		<h1>RATE A MOVIE</h1>
		<br>
		<p>This is about rating movies for your liking.</p>
	</header>
	<br>

	<section>
		<form action="">
			<img src="https://plus.unsplash.com/premium_vector-1719017644511-d368822bb3cb?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fG1vdmllc3xlbnwwfHwwfHx8MA%3D%3D" alt="logo">
			<br>
			
			<label for="movie"></label>


			<input type="text" name="movie" placeholder=" Enter here">

			<br>
			<label for="genre">Genre</label>
			<br>
			<input type="checkbox" id="genre1"name="genre1">
			<label for="genre1">Action</label>
			<input type="checkbox" id="genre1"name="genre2">
			<label for="genre2">Drama</label>
			<input type="checkbox" id="genre1"name="genre3">
			<label for="genre3">Romance</label>
			<input type="checkbox" id="genre1"name="genre4">
			<label for="genre4">Comedy</label>
			<input type="checkbox" id="genre5"name="genre">
			<label for="genre5">Horror</label>
			<!--make a copy of line 33 and 34 based on the number of genres. just change the IDs-->

				<br>
				<label for="rating">Rating</label>
			<br>
			<input type="radio" id="rate1"
			name="rate">
			<label for="rate1">⭐️</label>
			<input type="radio" id="rate2"
			name="rate">
			<label for="rate2">⭐️⭐️</label>
			<input type="radio" id="rate3"
			name="rate">
			<label for="rate3">⭐️⭐️⭐️</label>
			<input type="radio" id="rate4"
			name="rate">
			<label for="rate4">⭐️⭐️⭐️⭐️</label>
			<input type="radio" id="rate5"
			name="rate">
			<label for="rate5">⭐️⭐️⭐️⭐️⭐️</label>
			<!--make a copy of lines 40 -41, IDs should be different, name should be same for all-->

			<br>
			<textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
			<br>

			<input type="submit" id="submit" value="Submit Review">
			<br>

			Click <a href="" target="">here</a> for the guide in making a review.

		</form>
	</section>
